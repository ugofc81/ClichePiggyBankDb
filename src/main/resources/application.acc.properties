spring.application.name=ClichePiggyBankDb

# Database Connection Settings
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Settings
# update: Automatically builds/modifies database tables to match your Java code structure
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dynamically binds to Elastic Beanstalk default port 5000
server.port=${PORT:5000}

# Custom property to allow local React app connection
app.cors.allowed-origins=http://amazonaws.com