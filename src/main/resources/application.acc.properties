spring.application.name=ClichePiggyBankDb

# Database Connection Settings
spring.datasource.url=jdbc:mysql://cliche-piggybank-db.c3us4y4acgmm.eu-central-1.rds.amazonaws.com:3306/cliche-piggybank-db?serverTimezone=UTC\
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Settings
# update: Automatically builds/modifies database tables to match your Java code structure
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=9092

# Custom property to allow local React app connection
app.cors.allowed-origins=http://amazonaws.com