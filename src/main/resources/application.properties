spring.application.name=ClichePiggyBankDb

# Database Connection Settings
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Settings
# update: Automatically builds/modifies database tables to match your Java code structure
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# src/test/resources/application.properties
SPRING_DATASOURCE_URL=jdbc:mysql://localhost:3306/user_db?useSSL=false&serverTimezone=UTC
SPRING_DATASOURCE_USERNAME=root
SPRING_DATASOURCE_PASSWORD=secret
APP_CORS_ALLOWED-ORIGINS=http://localhost:5173
# Add any other environment variable names you moved here

# Format: ${ENV_VAR_NAME:default_fallback_value}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/user_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret}
app.cors.allowed-origins=${APP_CORS_ALLOWED-ORIGINS:http://localhost:5173}