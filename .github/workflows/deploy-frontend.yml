name: Deploy Frontend to AWS S3

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install and Build Application for ACC
        run: |
          npm install
          # 🔥 Forces Vite to compile using the settings found inside .env.acceptance
          npm run build -- --mode acceptance 

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync Build Folder to ACC S3 Bucket
        run: |
          aws s3 sync dist/ s3://cliche-piggybank-frontend-acc --delete